name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check-macos:
    name: Check (macos-arm64)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  check-debian:
    name: Check (debian-13-amd64)
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 30

    steps:
      - name: Install Debian build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git \
            libclang-dev pkg-config
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - uses: actions/setup-node@v4
        with:
          node-version-file: crates/markplane-web/ui/.nvmrc
          cache: npm
          cache-dependency-path: crates/markplane-web/ui/package-lock.json

      - name: Frontend lint & build
        working-directory: crates/markplane-web/ui
        run: |
          npm ci
          npm run lint
          npm run build

  musl:
    name: musl (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 30

    steps:
      - name: Install Debian build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git \
            libclang-dev musl-tools pkg-config
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: Build (aws-lc-rs / musl smoke)
        run: cargo build --locked --target x86_64-unknown-linux-musl -p markplane-cli

      - name: Assert single crypto provider (no ring)
        run: |
          if cargo tree -p markplane-cli -i ring --target x86_64-unknown-linux-musl 2>/dev/null | grep -q .; then
            echo "error: ring appears in the dependency tree; expected aws-lc-rs only" >&2
            cargo tree -p markplane-cli -i ring --target x86_64-unknown-linux-musl
            exit 1
          fi
          echo "ok: ring not in markplane-cli tree for musl"
