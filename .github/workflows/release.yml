name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install Debian deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Extract and validate version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(sed -n '/\[workspace\.package\]/,/\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)
          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build frontend
    needs: validate
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 10
    steps:
      - name: Install Debian deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: crates/markplane-web/ui/.nvmrc
          cache: npm
          cache-dependency-path: crates/markplane-web/ui/package-lock.json

      - name: Build
        working-directory: crates/markplane-web/ui
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: crates/markplane-web/ui/out/
          retention-days: 1

  build-macos:
    name: Build aarch64-apple-darwin
    needs: [validate, build-frontend]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: crates/markplane-web/ui/out/

      - name: Build
        run: cargo build --locked --release --features embed-ui --target aarch64-apple-darwin

      - name: Smoke test
        run: ./target/aarch64-apple-darwin/release/markplane --version

      - name: Package
        run: |
          ARCHIVE="markplane-v${{ needs.validate.outputs.version }}-aarch64-apple-darwin.tar.gz"
          tar -czf "$ARCHIVE" -C target/aarch64-apple-darwin/release markplane
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-aarch64-apple-darwin
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  build-linux:
    name: Build x86_64-unknown-linux-musl
    needs: [validate, build-frontend]
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 30
    steps:
      - name: Install Debian build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git \
            libclang-dev musl-tools pkg-config
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: crates/markplane-web/ui/out/

      - name: Build
        run: cargo build --locked --release --features embed-ui --target x86_64-unknown-linux-musl

      - name: Smoke test
        run: ./target/x86_64-unknown-linux-musl/release/markplane --version

      - name: Package
        run: |
          ARCHIVE="markplane-v${{ needs.validate.outputs.version }}-x86_64-unknown-linux-musl.tar.gz"
          tar -czf "$ARCHIVE" -C target/x86_64-unknown-linux-musl/release markplane
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-musl
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  create-release:
    name: Create release
    needs: [validate, build-macos, build-linux]
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 10
    steps:
      - name: Install Debian deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum markplane-v* > checksums-sha256.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            markplane-v*
            checksums-sha256.txt
            install.sh
